name: Unit Tests Only

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: unit-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    if: false # Temporarily disabled: source-only work; do not compile until explicitly requested.
    name: Compile and run unit tests (no APK)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify offline-only manifest
        shell: bash
        run: |
          if grep -Eq 'uses-permission[^>]*android.permission.INTERNET' app/src/main/AndroidManifest.xml; then
            echo "ERROR: INTERNET permission found in offline app."
            exit 1
          fi

      - name: Run unit tests
        run: gradle --no-daemon --stacktrace testDebugUnitTest

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ali-test-series-unit-test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 7
