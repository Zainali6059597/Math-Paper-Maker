name: Build Android APK

on:
  # Development commits must not trigger APK builds automatically.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      # 1. Download repository source
      - name: Checkout source
        uses: actions/checkout@v4

      # 2. Install Java 17 (required by AGP 8.7.3)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. Install Android SDK without deprecated "tools"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      # 4. Install compatible Gradle 8.9
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # 5. Verify project files before compilation
      - name: Verify project structure
        shell: bash
        run: |
          set -e
          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml
          test -d app/src/main/java || test -d app/src/main/kotlin
          echo "Project structure verified."

      # 6. Verify SDK and Java versions
      - name: Verify build environment
        shell: bash
        run: |
          java -version
          gradle --version
          sdkmanager --list_installed

      # 7. Ensure the app remains offline-only
      - name: Verify offline-only manifest
        shell: bash
        run: |
          if grep -Eq 'uses-permission[^>]*android.permission.INTERNET' app/src/main/AndroidManifest.xml; then
            echo "ERROR: INTERNET permission found in offline app."
            exit 1
          fi
          echo "Offline-only manifest verified."

      # 8. Validate every bundled offline content pack before compilation
      - name: Validate bundled question banks
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          files = sorted(Path("app/src/main/assets/content-packs").glob("*.json"))
          if not files:
              raise SystemExit("No bundled JSON content packs found.")
          seen_sources, seen_patterns, seen_questions, seen_fingerprints, seen_identities = set(), set(), set(), set(), set()
          for path in files:
              pack = json.loads(path.read_text(encoding="utf-8"))
              identity, source, pattern = pack["identity"], pack["source"], pack["pattern"]
              slots, questions = pattern["slots"], pack["questions"]
              groups = pattern.get("choiceGroups", [])
              assert identity["grade"] in (9, 10), f"{path}: unsupported grade"
              assert slots and questions, f"{path}: empty slots or question bank"
              assert len({s["slotId"] for s in slots}) == len(slots), f"{path}: duplicate slot IDs"
              assert len({q["questionId"] for q in questions}) == len(questions), f"{path}: duplicate question IDs"
              identity_key = tuple(identity[k] for k in ("board", "grade", "stream", "subject", "session"))
              assert identity_key not in seen_identities, f"{path}: duplicate package identity"
              assert source["sourceId"] not in seen_sources, f"{path}: duplicate source ID"
              assert pattern["patternId"] not in seen_patterns, f"{path}: duplicate pattern ID"
              seen_identities.add(identity_key)
              seen_sources.add(source["sourceId"])
              seen_patterns.add(pattern["patternId"])
              for question in questions:
                  assert question["questionId"] not in seen_questions, f"{path}: question ID collides with another pack"
                  assert question["semanticFingerprint"] not in seen_fingerprints, f"{path}: semantic fingerprint collision"
                  assert question.get("answerText"), f"{path}: question without answer: {question['questionId']}"
                  seen_questions.add(question["questionId"])
                  seen_fingerprints.add(question["semanticFingerprint"])
              required = {}
              for slot in slots:
                  signature = (slot.get("chapterId"), slot["questionType"], slot["marks"], slot.get("sloId") or "")
                  required[signature] = required.get(signature, 0) + 1
              for (chapter, qtype, marks, slo), count in required.items():
                  candidates = [q for q in questions if q["questionType"] == qtype and q["marks"] == marks
                                and (chapter is None or q["chapterId"] == chapter)
                                and (not slo or q.get("sloId") == slo)]
                  assert len(candidates) >= count, f"{path}: insufficient matching questions for {chapter}/{qtype}/{marks}"
              attempted = sum(s["marks"] for s in slots if not s.get("groupId"))
              for group in groups:
                  members = [s for s in slots if s.get("groupId") == group["groupId"]]
                  assert len(members) == group["offeredCount"], f"{path}: offered count mismatch in {group['groupId']}"
                  assert all(s["marks"] == group["marksPerQuestion"] for s in members), f"{path}: inconsistent marks in {group['groupId']}"
                  attempted += group["attemptCount"] * group["marksPerQuestion"]
              assert attempted == pattern["totalMarks"], f"{path}: attempted marks do not equal totalMarks"
              assert not any(q["chapterId"] == "CH8" for q in questions), f"{path}: excluded Chapter 8 content found"
              assert source["sourceUrl"].startswith("https://"), f"{path}: missing official source URL"
              print(f"Validated {path.name}: {len(questions)} answered questions, {pattern['totalMarks']} attempted marks.")
          PY
      # 9. Run unit tests
      - name: Run unit tests
        run: gradle --no-daemon --stacktrace testDebugUnitTest

      # 10. Build the installable debug APK only after all tests pass
      - name: Build debug APK
        run: gradle --no-daemon --stacktrace assembleDebug

      # 11. Publish the APK as a downloadable workflow artifact
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: maths-paper-maker-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      # 12. Preserve test reports, even if tests fail
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maths-paper-maker-test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 7
          
